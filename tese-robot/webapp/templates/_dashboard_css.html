<style>
/* ===== WarRobot dashboard — PRO-THEME (single stylesheet, light + dark) =====
   Replaces the stacked patch layers (apply_theme / apply_light / polish_chart /
   add_animations). Theme is chosen by [data-theme] on <html>. */
:root{
  --font:"Vazirmatn","Vazir","IRANSans",Tahoma,"Segoe UI",system-ui,sans-serif;
  --radius:14px; --radius-sm:10px;
  --bg:#f4f6fa; --surface:#ffffff; --surface2:#f8fafc; --line:#e4e9f0; --line2:#d5dde8;
  --txt:#111a24; --txt2:#334255; --muted:#5f6e7f;
  --accent:#2563eb; --accent-soft:#e8effd;
  --pos:#0f7a45; --pos-soft:#e5f5ec; --neg:#c22a2a; --neg-soft:#fdecec;
  --warn:#a15c00; --warn-soft:#fff4e0; --unk:#64748b; --unk-soft:#eef1f5;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 4px 14px rgba(16,24,40,.06);
  --chart-grid:#e8edf3; --chart-line:#2563eb; --chart-fill:rgba(37,99,235,.10);
  color-scheme:light;
}
html[data-theme="dark"]{
  --bg:#0c1117; --surface:#141b23; --surface2:#18212b; --line:#232e3a; --line2:#2d3a48;
  --txt:#e9eef4; --txt2:#c3cdd8; --muted:#93a1b0;
  --accent:#5b9cff; --accent-soft:#16253b;
  --pos:#3ecf86; --pos-soft:#12291e; --neg:#ff7a7a; --neg-soft:#2e1517;
  --warn:#f5b54a; --warn-soft:#2d2210; --unk:#94a3b8; --unk-soft:#1b232d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  --chart-grid:#222c37; --chart-line:#5b9cff; --chart-fill:rgba(91,156,255,.14);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--font);
     font-size:15px;line-height:1.7;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
b,strong{font-weight:700}
.num,.kpi .val,td.n{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.pos{color:var(--pos)} .neg{color:var(--neg)} .muted{color:var(--muted)}
small{font-size:.8em}

/* ---------- header ---------- */
.topbar{position:sticky;top:0;z-index:50;background:var(--surface);background:color-mix(in srgb,var(--surface) 88%,transparent);
  backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line)}
.topbar-in{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;border-radius:10px;flex:0 0 34px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--accent),#7c3aed);color:#fff;font-weight:800;font-size:15px}
.brand h1{margin:0;font-size:17px;font-weight:800;line-height:1.2;white-space:nowrap}
.brand .sub{display:block;font-size:11.5px;color:var(--muted);font-weight:500;white-space:nowrap}
.top-actions{margin-inline-start:auto;display:flex;align-items:center;gap:8px}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);
  color:var(--txt2);display:grid;place-items:center;cursor:pointer;font-size:17px;padding:0}
.icon-btn:hover{background:var(--surface2)}
.icon-btn svg{width:18px;height:18px}
.meta-row{max-width:1280px;margin:0 auto;padding:0 16px 10px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.meta-row::-webkit-scrollbar{display:none}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;line-height:1;
  padding:6px 10px;border-radius:999px;background:var(--unk-soft);color:var(--txt2);white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.ok{background:var(--pos-soft);color:var(--pos)}
.chip.bad{background:var(--neg-soft);color:var(--neg)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.unk{background:var(--unk-soft);color:var(--unk)}
.chip.live{background:var(--neg-soft);color:var(--neg)}
.chip.dry{background:var(--pos-soft);color:var(--pos)}

/* ---------- tabs ---------- */
.tabs-wrap{position:sticky;top:var(--topbar-h,58px);z-index:40;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs{max-width:1280px;margin:0 auto;padding:0 10px;display:flex;gap:2px;overflow-x:auto;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:12px 14px;min-height:46px;border:0;background:none;cursor:pointer;
  color:var(--muted);font:600 14px var(--font);border-bottom:2.5px solid transparent;white-space:nowrap}
.tab:hover{color:var(--txt)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab .cnt{font-size:11px;background:var(--unk-soft);color:var(--muted);border-radius:999px;padding:1px 7px;margin-inline-start:4px}

/* ---------- layout ---------- */
main{max-width:1280px;margin:0 auto;padding:16px 16px 60px}
.panel{display:none} .panel.active{display:block;animation:fade .25s ease both}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.section{margin-top:22px}
.section-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 10px}
.section-h h2{margin:0;font-size:16px;font-weight:800}
.section-h .aside{font-size:12px;color:var(--muted);margin-inline-start:auto}
h2{font-size:16px;font-weight:800;margin:22px 0 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:14px 16px}
.note{color:var(--muted);font-size:12.5px;line-height:1.85;margin:6px 0 12px}
.empty{padding:22px 16px;text-align:center;color:var(--muted);background:var(--surface);
  border:1px dashed var(--line2);border-radius:var(--radius);font-size:13.5px}
.grid2{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:1000px){.grid2{grid-template-columns:1.25fr 1fr}}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:14px 16px;min-width:0}
.kpi .lbl{color:var(--muted);font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .val{font-size:22px;font-weight:800;line-height:1.35;margin-top:4px;text-align:right;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .val .unit{font-size:12px;font-weight:600;color:var(--muted);margin-inline-start:5px}
.kpi .val bdi{direction:ltr}
bdi.dt{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.kpi.hero .val{font-size:26px}
.kpi.mini{padding:10px 14px;box-shadow:none}
.kpi.mini .val{font-size:17px}
.kpis.minis{grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:12px}

/* ---------- health ---------- */
.health-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.health-head h2{margin:0;font-size:16px}
.health-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.hitem{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start;min-width:0}
.hitem .ind{width:10px;height:10px;border-radius:50%;margin-top:7px;flex:0 0 10px;background:var(--unk)}
.hitem.ok .ind{background:var(--pos);box-shadow:0 0 0 4px var(--pos-soft)}
.hitem.bad .ind{background:var(--neg);box-shadow:0 0 0 4px var(--neg-soft)}
.hitem.warn .ind{background:var(--warn);box-shadow:0 0 0 4px var(--warn-soft)}
.hitem .t{font-size:12.5px;color:var(--muted);font-weight:600}
.hitem .v{font-weight:800;font-size:15px}
.hitem.bad .v{color:var(--neg)} .hitem.warn .v{color:var(--warn)} .hitem.ok .v{color:var(--pos)}
.hitem .d{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.jobs{padding:12px 16px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.jobs .t{font-size:12.5px;color:var(--muted);font-weight:600;margin-inline-end:4px;width:100%}
.job{font-size:12px;padding:5px 9px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);
  color:var(--muted);white-space:nowrap}
.job.done{color:var(--txt2);border-color:var(--line2)}
.job.done::before{content:"✓ ";color:var(--pos);font-weight:800}
.job .tm{color:var(--muted);font-variant-numeric:tabular-nums}
details.more{border-top:1px solid var(--line)}
details.more summary{cursor:pointer;padding:10px 16px;font-size:13px;font-weight:600;color:var(--accent);list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:" ▾"}
details.more[open] summary::after{content:" ▴"}
.err-list{list-style:none;margin:0;padding:0 16px 12px}
.err-list li{padding:7px 0;border-bottom:1px dashed var(--line);font-size:12.5px;display:flex;gap:8px;flex-wrap:wrap}
.err-list li:last-child{border-bottom:0}
.err-list code{font-family:ui-monospace,Consolas,monospace;font-size:12px;direction:ltr;unicode-bidi:isolate;
  color:var(--neg);overflow-wrap:anywhere}

/* ---------- positions ---------- */
.positions{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.pcard{padding:14px 16px}
.pcard .top{display:flex;align-items:center;gap:10px}
.pcard .sym{font-size:18px;font-weight:800}
.pcard .pl{margin-inline-start:auto;text-align:left}
.pcard .pl .pct{font-size:18px;font-weight:800;direction:ltr;unicode-bidi:isolate}
.pcard .pl .rial{display:block;font-size:12px;direction:ltr;unicode-bidi:isolate}
.pcard dl{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 10px;margin:12px 0 10px}
.pcard dt{font-size:11.5px;color:var(--muted)}
.pcard dd{margin:0;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.tpsl{margin-top:4px}
.tpsl .bar{position:relative;height:8px;border-radius:999px;
  background:linear-gradient(to left,var(--neg-soft),var(--unk-soft) 40%,var(--pos-soft));border:1px solid var(--line)}
.tpsl .zero{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--muted);opacity:.5}
.tpsl .mark{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;transform:translate(50%,-50%);
  background:var(--accent);border:2px solid var(--surface);box-shadow:0 0 0 1px var(--accent)}
.tpsl .ends{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:6px;gap:8px}
.tpsl .ends b{font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--unk-soft);color:var(--muted)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}

/* ---------- tables ---------- */
.table-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);
  border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
th,tr.head th{font-size:12px;font-weight:700;color:var(--muted);background:var(--surface2)}
tbody tr:last-child td,table tr:last-child td{border-bottom:0}
tr:not(.head):hover td{background:var(--surface2)}
td.wrap,td.note{white-space:normal;min-width:180px;margin:0;font-size:12.5px}
td .src,.src{color:var(--muted);font-size:11px}
td .rial{display:block;font-size:11.5px;color:var(--muted);direction:ltr;unicode-bidi:isolate}
.side{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:6px}
.side.buy{background:var(--pos-soft);color:var(--pos)} .side.sell{background:var(--neg-soft);color:var(--neg)}
.mono{font-family:ui-monospace,Consolas,monospace;direction:ltr;unicode-bidi:isolate;font-size:12px}

/* ---------- charts ---------- */
.chart-card{padding:12px 12px 8px}
.chart-box{position:relative;height:280px}
.chart-legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12px;color:var(--muted);margin:4px 4px 8px}
.chart-legend .swatch{width:18px;height:3px;background:var(--chart-line);border-radius:2px;display:inline-block;vertical-align:middle;margin-inline-end:4px}
svg.chart{width:100%;height:auto;display:block;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-top:8px}
svg.chart .grid{stroke:var(--chart-grid);stroke-width:1}
svg.chart .zero{stroke:var(--muted);stroke-width:1;stroke-dasharray:5 5}
svg.chart .line{fill:none;stroke:var(--chart-line);stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round}
svg.chart text{font-family:var(--font)}
svg.chart .axis{fill:var(--muted);font-size:12px}
svg.chart .point-label{fill:var(--txt);font-size:13px;font-weight:700}
svg.chart .point-value{fill:var(--muted);font-size:11.5px;font-weight:600}
svg.chart .zone{fill:var(--muted);font-size:12px;font-weight:700;opacity:.7}
svg.chart .legend-main{fill:var(--txt);font-size:14px;font-weight:800}

/* ---------- export / forms ---------- */
.export-item{margin-bottom:14px}
.export-tools{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.btn{font:600 13px var(--font);padding:8px 14px;border-radius:10px;border:1px solid var(--line2);
  background:var(--surface);color:var(--txt);cursor:pointer;min-height:38px}
.btn:hover{background:var(--surface2)}
.btn.danger:hover{background:var(--neg-soft);color:var(--neg);border-color:var(--neg)}
.export-meta{color:var(--muted);font-size:12px;margin-inline-start:auto}
.export-body{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;
  white-space:pre-wrap;overflow:auto;font-size:13.5px;line-height:1.9;max-height:60vh;margin:0;font-family:var(--font)}
.alloc{padding:12px 16px;margin-bottom:14px}

.cand-list{list-style:none;margin:0;padding:4px 0}
.cand-list li{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line)}
.cand-list li:last-child{border-bottom:0}
.cand-list .rank{width:28px;height:28px;flex:0 0 28px;border-radius:8px;background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;font-weight:800;font-size:13px}
.cand-list .c-main{min-width:0;display:flex;flex-direction:column}
.cand-list .c-sub{font-size:12px;color:var(--muted)}
.cand-list .score{margin-inline-start:auto;font-weight:800;color:var(--pos);background:var(--pos-soft);
  border-radius:8px;padding:2px 10px;font-size:13px}
.olist{list-style:none;margin:0;padding:0}
.olist li{padding:10px 14px;border-bottom:1px solid var(--line)}
.olist li:last-child{border-bottom:0}
.olist .o1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.olist .o1 .chip{padding:4px 8px;font-size:11px}
.olist .o-at{margin-inline-start:auto;font-size:12px;color:var(--muted)}
.olist .o2{font-size:12px;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}
.only-sm{display:none}
.svg-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.foot{color:var(--muted);font-size:12px;text-align:center;margin-top:30px;line-height:2}

/* ---------- mobile ---------- */
@media (max-width:720px){
  body{font-size:14.5px}
  main{padding:12px 12px 50px}
  .brand .sub,.hide-sm{display:none}
  .only-sm{display:block}
  .svg-scroll svg.chart{min-width:720px}
  svg.chart .axis{font-size:14px} svg.chart .point-label{font-size:15px} svg.chart .point-value{font-size:13px}
  svg.chart .legend-main{font-size:16px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi{padding:12px}
  .kpi .val,.kpi.hero .val{font-size:18px}
  .kpi.hero{grid-column:1/-1}
  .kpi.hero .val{font-size:24px}
  .kpis.minis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi.mini .val{font-size:15px}
  .health-grid{grid-template-columns:1fr}
  .positions{grid-template-columns:1fr}
  .chart-box{height:230px}
  /* tables become stacked cards: one block per row, label + value */
  .table-wrap.stack{border:0;background:none;box-shadow:none;overflow:visible}
  table.responsive,table.responsive tbody{display:block}
  table.responsive tr.head,table.responsive thead{display:none}
  table.responsive tr{display:block;background:var(--surface);border:1px solid var(--line);border-radius:12px;
    margin-bottom:10px;padding:4px 14px;box-shadow:var(--shadow)}
  table.responsive td{display:flex;justify-content:space-between;align-items:center;gap:14px;
    border-bottom:1px dashed var(--line);padding:9px 0;white-space:normal;text-align:left;min-width:0}
  table.responsive td:last-child{border-bottom:0}
  table.responsive td::before{content:attr(data-label);color:var(--muted);font-size:12px;font-weight:600;
    flex:0 0 auto;text-align:right}
  table.responsive td.wrap,table.responsive td.note{display:block;text-align:right}
  table.responsive td.wrap::before,table.responsive td.note::before{display:block;margin-bottom:2px}
  tr:not(.head):hover td{background:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media print{.topbar,.tabs-wrap{position:static}.panel{display:block!important}}
</style>
